<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="theme-color" content="#1D9E75">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Finanzas del Hogar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    :root {
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #0F6E56;
      --red: #D85A30;
      --red-light: #FAECE7;
      --red-dark: #993C1D;
      --bg: #F5F5F0;
      --bg-card: #FFFFFF;
      --text: #1a1a18;
      --text2: #6B6B66;
      --border: rgba(0,0,0,0.1);
      --radius: 14px;
      --radius-sm: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --bg-card: #1e1e1c;
        --text: #f0ede6;
        --text2: #9a9891;
        --border: rgba(255,255,255,0.1);
        --green-light: #0a3325;
        --red-light: #3a1a0d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: var(--text); overscroll-behavior: none; }

    /* LAYOUT */
    .app { display: flex; flex-direction: column; height: 100%; max-width: 430px; margin: 0 auto; }
    .screen { display: none; flex: 1; overflow-y: auto; padding: 0 16px 12px; padding-top: calc(var(--safe-top) + 56px); padding-bottom: calc(var(--safe-bottom) + 80px); }
    .screen.active { display: block; }

    /* TOP BAR */
    .topbar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; z-index: 100; background: var(--bg); border-bottom: 0.5px solid var(--border); padding: calc(var(--safe-top) + 10px) 16px 10px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 17px; font-weight: 600; }
    .month-nav { display: flex; align-items: center; gap: 8px; }
    .month-nav button { background: none; border: none; font-size: 20px; color: var(--green); padding: 4px 6px; cursor: pointer; }
    .month-label { font-size: 15px; font-weight: 500; min-width: 110px; text-align: center; }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--bg-card); border-top: 0.5px solid var(--border); display: flex; padding-bottom: var(--safe-bottom); z-index: 100; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 8px; cursor: pointer; border: none; background: none; color: var(--text2); font-size: 10px; font-weight: 500; transition: color .15s; }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--green); }

    /* CARDS */
    .card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin-bottom: 14px; }

    /* METRICS */
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .metric-full { grid-column: 1 / -1; }
    .metric { background: var(--bg-card); border-radius: var(--radius); padding: 14px 16px; }
    .metric label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
    .metric .val { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
    .metric .val.inc { color: var(--green); }
    .metric .val.exp { color: var(--red); }

    /* TX LIST */
    .tx-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 0.5px solid var(--border); }
    .tx-item:last-child { border-bottom: none; }
    .tx-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .tx-icon.income { background: var(--green-light); }
    .tx-icon.expense { background: var(--red-light); }
    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-amount { font-size: 15px; font-weight: 600; }
    .tx-amount.income { color: var(--green); }
    .tx-amount.expense { color: var(--red); }
    .tx-del { font-size: 18px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 4px; opacity: .5; margin-left: 4px; }
    .tx-del:active { opacity: 1; }
    .empty { text-align: center; padding: 32px 16px; color: var(--text2); font-size: 15px; }

    /* FORM */
    .type-toggle { display: flex; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 16px; }
    .type-btn { flex: 1; padding: 9px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text2); transition: all .15s; }
    .type-btn.active-inc { background: var(--bg-card); color: var(--green); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .type-btn.active-exp { background: var(--bg-card); color: var(--red); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .field { margin-bottom: 12px; }
    .field label { font-size: 13px; color: var(--text2); margin-bottom: 5px; display: block; }
    .field input, .field select { width: 100%; background: var(--bg); border: none; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; appearance: none; -webkit-appearance: none; }
    .field input:focus, .field select:focus { box-shadow: 0 0 0 2px var(--green); }
    .btn-primary { width: 100%; padding: 15px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 8px; letter-spacing: -.2px; }
    .btn-primary:active { opacity: .85; transform: scale(.99); }

    /* UPLOAD TICKET */
    .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px 16px; text-align: center; cursor: pointer; position: relative; background: var(--bg); margin-bottom: 12px; transition: border-color .2s; }
    .upload-zone:active { border-color: var(--green); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .upload-zone .uz-icon { font-size: 40px; margin-bottom: 8px; }
    .upload-zone p { font-size: 15px; font-weight: 500; color: var(--text); }
    .upload-zone small { font-size: 13px; color: var(--text2); }
    .preview-img { width: 100%; max-height: 180px; object-fit: contain; border-radius: var(--radius-sm); margin-bottom: 12px; display: none; }
    .scan-card { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
    .scan-header { padding: 14px 16px 10px; border-bottom: 0.5px solid var(--border); }
    .scan-header h3 { font-size: 15px; font-weight: 600; }
    .scan-header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .scan-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
    .scan-item:last-of-type { border-bottom: none; }
    .scan-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--green); flex-shrink: 0; }
    .scan-item .si-info { flex: 1; min-width: 0; }
    .scan-item .si-desc { font-size: 15px; font-weight: 500; }
    .scan-item .si-cat { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .scan-item .si-amt { font-size: 15px; font-weight: 600; color: var(--red); flex-shrink: 0; }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px; color: var(--text2); font-size: 15px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BARS */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .bar-emoji { width: 28px; text-align: center; font-size: 16px; }
    .bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
    .bar-val { font-size: 13px; font-weight: 600; width: 72px; text-align: right; flex-shrink: 0; }

    /* BUDGET */
    .budget-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
    .budget-row:last-child { border-bottom: none; }
    .budget-cat { flex: 1; font-size: 15px; font-weight: 500; }
    .budget-spent { font-size: 13px; color: var(--text2); }
    .budget-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .budget-input { width: 90px; background: var(--bg); border: none; border-radius: 6px; padding: 7px 10px; font-size: 14px; color: var(--text); text-align: right; }

    /* ANNUAL */
    .year-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .year-pill { padding: 6px 16px; border-radius: 999px; border: 1px solid var(--border); font-size: 14px; font-weight: 500; background: none; color: var(--text2); cursor: pointer; }
    .year-pill.active { background: var(--green); color: #fff; border-color: var(--green); }
    .annual-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .annual-table th { color: var(--text2); font-weight: 600; text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .annual-table th:first-child { text-align: left; }
    .annual-table td { padding: 9px 4px; border-bottom: 0.5px solid var(--border); text-align: right; }
    .annual-table td:first-child { text-align: left; color: var(--text2); font-weight: 500; }
    .annual-table .pos { color: var(--green); font-weight: 600; }
    .annual-table .neg { color: var(--red); font-weight: 600; }
    .annual-table tfoot td { font-weight: 700; border-top: 1px solid var(--border); border-bottom: none; font-size: 14px; }
  </style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <span class="topbar-title">💰 Finanzas <span id="sync-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;margin-left:4px;vertical-align:middle"></span></span>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <!-- SCREENS -->
  <div class="screen active" id="s-resumen"></div>
  <div class="screen" id="s-registrar"></div>
  <div class="screen" id="s-ticket"></div>
  <div class="screen" id="s-graficos"></div>
  <div class="screen" id="s-anual"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showScreen('resumen',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Resumen
    </button>
    <button class="nav-item" onclick="showScreen('registrar',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Agregar
    </button>
    <button class="nav-item" onclick="showScreen('ticket',this)">
      <svg viewBox="0 0 24 24"><path d="M14.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9.5L14.5 4z"/><polyline points="14 4 14 10 20 10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>
      Ticket
    </button>
    <button class="nav-item" onclick="showScreen('graficos',this)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Gráficos
    </button>
    <button class="nav-item" onclick="showScreen('anual',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Anual
    </button>
  </nav>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA0IwaRWf8fOEJmTmV3dhIpsTn7V_r31KI",
  authDomain: "finanzas-hogar-bfb7c.firebaseapp.com",
  projectId: "finanzas-hogar-bfb7c",
  storageBucket: "finanzas-hogar-bfb7c.firebasestorage.app",
  messagingSenderId: "821752721307",
  appId: "1:821752721307:web:76ee314134fd9addae3b3e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CATS=['Alimentación','Servicios','Salud','Educación','Transporte','Entretenimiento','Ahorros','Otros'];
const CAT_COLORS=['#1D9E75','#378ADD','#D4537E','#7F77DD','#D85A30','#BA7517','#639922','#888780'];
const CAT_EMOJIS={Alimentación:'🛒',Servicios:'💡',Salud:'❤️',Educación:'📚',Transporte:'🚌',Entretenimiento:'🎬',Ahorros:'💰',Otros:'📦'};
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_S=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let txs=[], budgets={}, currentDate=new Date(), selectedYear=new Date().getFullYear(), currentType='expense';
let barChart, donutChart, annualChart;

// mostrar indicador de conexión
function setStatus(ok){
  const el=document.getElementById('sync-dot');
  if(el)el.style.background=ok?'#1D9E75':'#D85A30';
}

// escuchar cambios en tiempo real desde Firebase
function load(){
  // transacciones
  onSnapshot(collection(db,'transacciones'), snap=>{
    txs=snap.docs.map(d=>({...d.data(),_docId:d.id}));
    txs.sort((a,b)=>b.date.localeCompare(a.date));
    setStatus(true);
    renderAll();
    if(document.getElementById('s-anual').classList.contains('active'))renderAnual();
  }, ()=>setStatus(false));

  // presupuestos
  onSnapshot(doc(db,'config','budgets'), snap=>{
    if(snap.exists()) budgets=snap.data();
    renderAll();
  });
}

async function save(){
  // budgets se guardan en Firebase, no localmente
  await setDoc(doc(db,'config','budgets'), budgets);
}
function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function mTxs(){return txs.filter(t=>t.date&&t.date.startsWith(mk(currentDate)))}
function yTxs(y){return txs.filter(t=>t.date&&t.date.startsWith(y+'-'))}
function fmt(n){return '$'+Math.round(Math.abs(n)).toLocaleString('es-AR')}

function changeMonth(d){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+d,1);renderAll()}
function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
  // hide month nav on annual
  document.querySelector('.month-nav').style.display = id==='anual'?'none':'flex';
  document.querySelector('.topbar-title').style.display = id==='anual'?'block':'none';
  if(id==='anual')renderAnual();
  else renderAll();
}

function setType(t){
  currentType=t;
  document.getElementById('btn-inc').className='type-btn'+(t==='income'?' active-inc':'');
  document.getElementById('btn-exp').className='type-btn'+(t==='expense'?' active-exp':'');
}

async function addTx(){
  const desc=document.getElementById('f-desc').value.trim();
  const amount=parseFloat(document.getElementById('f-amount').value);
  const cat=document.getElementById('f-cat').value;
  const date=document.getElementById('f-date').value;
  if(!desc||!amount||amount<=0||!date){alert('Completá todos los campos.');return}
  await addDoc(collection(db,'transacciones'),{type:currentType,desc,amount,cat,date,createdAt:Date.now()});
  document.getElementById('f-desc').value='';
  document.getElementById('f-amount').value='';
  if(navigator.vibrate)navigator.vibrate(30);
  showScreen('resumen',document.querySelector('.nav-item'));
}

async function delTx(docId){
  if(confirm('¿Eliminar esta transacción?')){
    await deleteDoc(doc(db,'transacciones',docId));
  }
}

function renderAll(){
  const m=mTxs();
  document.getElementById('monthLabel').textContent=MONTHS[currentDate.getMonth()]+' '+currentDate.getFullYear();
  renderResumen(m);
  renderRegistrar(m);
  renderGraficos(m);
  renderBudget(m);
}

function renderResumen(m){
  const inc=m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=inc-exp;
  document.getElementById('s-resumen').innerHTML=`
    <div class="metrics">
      <div class="metric"><label>Ingresos</label><div class="val inc">${fmt(inc)}</div></div>
      <div class="metric"><label>Gastos</label><div class="val exp">${fmt(exp)}</div></div>
      <div class="metric metric-full"><label>Balance del mes</label><div class="val" style="color:${bal>=0?'var(--green)':'var(--red)'}">${(bal>=0?'+':'-')+fmt(bal)}</div></div>
    </div>
    <div class="card">
      <div class="card-title">Últimas transacciones</div>
      ${m.length?m.slice(0,20).map(t=>`
        <div class="tx-item">
          <div class="tx-icon ${t.type}">${CAT_EMOJIS[t.cat]||'📦'}</div>
          <div class="tx-info">
            <div class="tx-desc">${t.desc}</div>
            <div class="tx-meta">${t.cat} · ${t.date}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
          </div>
          <button class="tx-del" onclick="delTx('${t._docId}')">×</button>
        </div>`).join(''):'<div class="empty">Sin transacciones este mes</div>'}
    </div>`;
}

function renderRegistrar(m){
  document.getElementById('s-registrar').innerHTML=`
    <div class="card">
      <div class="card-title">Nueva transacción</div>
      <div class="type-toggle">
        <button class="type-btn active-exp" id="btn-exp" onclick="setType('expense')">— Gasto</button>
        <button class="type-btn" id="btn-inc" onclick="setType('income')">+ Ingreso</button>
      </div>
      <div class="field"><label>Descripción</label><input type="text" id="f-desc" placeholder="Ej: Supermercado Día"></div>
      <div class="field"><label>Monto ($)</label><input type="number" id="f-amount" placeholder="0" inputmode="decimal"></div>
      <div class="field"><label>Categoría</label>
        <select id="f-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Fecha</label><input type="date" id="f-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <button class="btn-primary" onclick="addTx()">Guardar</button>
    </div>
    <div class="card">
      <div class="card-title">Historial del mes</div>
      ${m.length?m.map(t=>`
        <div class="tx-item">
          <div class="tx-icon ${t.type}">${CAT_EMOJIS[t.cat]||'📦'}</div>
          <div class="tx-info"><div class="tx-desc">${t.desc}</div><div class="tx-meta">${t.cat} · ${t.date}</div></div>
          <div class="tx-amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
          <button class="tx-del" onclick="delTx('${t._docId}')">×</button>
        </div>`).join(''):'<div class="empty">Sin transacciones</div>'}
    </div>`;
  if(currentType==='income'){document.getElementById('btn-inc').className='type-btn active-inc';document.getElementById('btn-exp').className='type-btn';}
}

function renderGraficos(m){
  const expTotals={};
  m.filter(t=>t.type==='expense').forEach(t=>expTotals[t.cat]=(expTotals[t.cat]||0)+t.amount);
  const sorted=Object.entries(expTotals).sort((a,b)=>b[1]-a[1]);
  const maxVal=Math.max(...sorted.map(e=>e[1]),1);
  const inc=m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('s-graficos').innerHTML=`
    <div class="card">
      <div class="card-title">Gastos por categoría</div>
      ${sorted.length?sorted.map(([cat,val])=>{
        const i=CATS.indexOf(cat),color=i>=0?CAT_COLORS[i]:'#888780';
        return`<div class="bar-row">
          <span class="bar-emoji">${CAT_EMOJIS[cat]||'📦'}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/maxVal*100)}%;background:${color}"></div></div>
          <span class="bar-val" style="color:${color}">${fmt(val)}</span>
        </div>`}).join(''):'<div class="empty">Sin gastos este mes</div>'}
    </div>
    <div class="card">
      <div class="card-title">Ingresos vs gastos</div>
      <div style="position:relative;height:180px"><canvas id="barChart" role="img" aria-label="Ingresos vs gastos del mes"></canvas></div>
    </div>
    ${Object.keys(expTotals).length?`<div class="card">
      <div class="card-title">Distribución de gastos</div>
      <div id="donut-legend" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text2)"></div>
      <div style="position:relative;height:200px"><canvas id="donutChart" role="img" aria-label="Distribución de gastos por categoría"></canvas></div>
    </div>`:''}`;

  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('barChart'),{
    type:'bar',data:{labels:['Ingresos','Gastos'],datasets:[{data:[Math.round(inc),Math.round(exp)],backgroundColor:['#1D9E75','#D85A30'],borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString('es-AR'),font:{size:11}}}}}
  });

  if(Object.keys(expTotals).length){
    const labels=Object.keys(expTotals),data=labels.map(k=>Math.round(expTotals[k]));
    const colors=labels.map(l=>{const i=CATS.indexOf(l);return i>=0?CAT_COLORS[i]:'#888780'});
    const total=data.reduce((s,v)=>s+v,0);
    document.getElementById('donut-legend').innerHTML=labels.map((l,i)=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${colors[i]};display:inline-block"></span>${CAT_EMOJIS[l]||''} ${l} ${total?Math.round(data[i]/total*100):0}%</span>`).join('');
    if(donutChart)donutChart.destroy();
    donutChart=new Chart(document.getElementById('donutChart'),{
      type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}
    });
  }
}

function renderBudget(m){
  const totals={};m.filter(t=>t.type==='expense').forEach(t=>totals[t.cat]=(totals[t.cat]||0)+t.amount);
  document.getElementById('s-graficos').innerHTML+= `<div class="card"><div class="card-title">Presupuesto mensual</div>
    ${CATS.filter(c=>c!=='Ahorros'&&c!=='Otros').map(cat=>{
      const spent=Math.round(totals[cat]||0),lim=budgets[cat]||0;
      const over=lim&&spent>lim,ok=lim&&spent<=lim;
      return`<div class="budget-row">
        <span style="font-size:18px;margin-right:2px">${CAT_EMOJIS[cat]}</span>
        <span class="budget-cat">${cat}</span>
        <span class="budget-spent">${fmt(spent)}${lim?' / '+fmt(lim):''}</span>
        <input class="budget-input" type="number" placeholder="Límite" value="${lim||''}" onchange="budgets['${cat}']=parseFloat(this.value)||0;save()">
        <div class="budget-dot" style="background:${over?'#D85A30':ok?'#1D9E75':'#ccc'}"></div>
      </div>`}).join('')}
  </div>`;
}

function renderAnual(){
  const allYears=[...new Set(txs.map(t=>t.date?t.date.slice(0,4):null).filter(Boolean))].sort();
  if(!allYears.includes(String(selectedYear)))allYears.push(String(selectedYear));
  allYears.sort();
  const yTx=yTxs(selectedYear);
  const monthly=Array.from({length:12},(_,i)=>{
    const k=selectedYear+'-'+String(i+1).padStart(2,'0');
    const mo=yTx.filter(t=>t.date.startsWith(k));
    return{inc:mo.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp:mo.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)};
  });
  const totInc=monthly.reduce((s,m)=>s+m.inc,0);
  const totExp=monthly.reduce((s,m)=>s+m.exp,0);
  const totBal=totInc-totExp;

  document.getElementById('s-anual').innerHTML=`
    <div style="padding-top:16px">
    <div class="metrics">
      <div class="metric"><label>Total ingresos ${selectedYear}</label><div class="val inc">${fmt(totInc)}</div></div>
      <div class="metric"><label>Total gastos ${selectedYear}</label><div class="val exp">${fmt(totExp)}</div></div>
    </div>
    <div class="card">
      <div class="year-pills">${allYears.map(y=>`<button class="year-pill ${y==selectedYear?'active':''}" onclick="selectedYear=${y};renderAnual()">${y}</button>`).join('')}</div>
      <div style="position:relative;height:180px"><canvas id="annualChart" role="img" aria-label="Evolución mensual del año ${selectedYear}"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Detalle mes a mes</div>
      <table class="annual-table">
        <thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Balance</th></tr></thead>
        <tbody>${monthly.map((m,i)=>{
          const b=m.inc-m.exp,has=m.inc>0||m.exp>0;
          return`<tr style="${!has?'opacity:.35':''}">
            <td>${MONTHS_S[i]}</td>
            <td class="${m.inc>0?'pos':''}">${m.inc>0?fmt(m.inc):'-'}</td>
            <td class="${m.exp>0?'neg':''}">${m.exp>0?fmt(m.exp):'-'}</td>
            <td class="${b>=0?'pos':'neg'}">${has?(b>=0?'+':'-')+fmt(b):'-'}</td>
          </tr>`}).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="pos">${fmt(totInc)}</td><td class="neg">${fmt(totExp)}</td><td class="${totBal>=0?'pos':'neg'}">${(totBal>=0?'+':'-')+fmt(totBal)}</td></tr></tfoot>
      </table>
    </div></div>`;

  if(annualChart)annualChart.destroy();
  annualChart=new Chart(document.getElementById('annualChart'),{
    type:'bar',
    data:{labels:MONTHS_S,datasets:[
      {label:'Ingresos',data:monthly.map(m=>Math.round(m.inc)),backgroundColor:'#1D9E75',borderRadius:4,borderSkipped:false},
      {label:'Gastos',data:monthly.map(m=>Math.round(m.exp)),backgroundColor:'#D85A30',borderRadius:4,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},autoSkip:false}},y:{ticks:{callback:v=>'$'+v.toLocaleString('es-AR'),font:{size:10}}}}}
  });
}

// TICKET IA
function initTicket(){
  document.getElementById('s-ticket').innerHTML=`
    <div class="card">
      <div class="card-title">Escanear ticket con IA</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="ticketFile" accept="image/*" capture="environment" onchange="handleTicket(event)">
        <div class="uz-icon">📷</div>
        <p>Tocá para sacar una foto</p>
        <small>O elegí una imagen de tu galería</small>
      </div>
      <img id="ticketPreview" class="preview-img">
      <div id="scanArea"></div>
    </div>`;
}

async function handleTicket(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    const prev=document.getElementById('ticketPreview');
    prev.src=ev.target.result;prev.style.display='block';
    await scanTicket(ev.target.result.split(',')[1],file.type||'image/jpeg');
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

async function scanTicket(b64,mime){
  const area=document.getElementById('scanArea');
  area.innerHTML=`<div class="spinner-wrap"><div class="spinner"></div><span>Analizando el ticket...</span></div>`;
  const today=new Date().toISOString().split('T')[0];
  const prompt=`Analizá este ticket/recibo y extraé todos los ítems con su precio. Respondé SOLO con JSON válido, sin backticks:\n{"date":"${today}","store":"nombre o vacío","items":[{"desc":"descripción","amount":número,"cat":"una de: Alimentación|Servicios|Salud|Educación|Transporte|Entretenimiento|Ahorros|Otros"}]}\nSi hay un total general sin ítems, poné un solo ítem. Si no podés leer: {"error":"no se pudo leer"}`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:prompt}]}]})});
    const data=await resp.json();
    const text=data.content.map(c=>c.text||'').join('');
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    if(parsed.error){area.innerHTML=`<div style="padding:16px;color:var(--red);font-size:15px">⚠️ ${parsed.error}</div>`;return}
    showScanResult(parsed);
  }catch(err){
    area.innerHTML=`<div style="padding:16px;color:var(--red);font-size:15px">❌ Error al analizar. Intentá con otra foto.</div>`;
  }
}

function showScanResult(data){
  const area=document.getElementById('scanArea');
  if(!data.items?.length){area.innerHTML='<div style="padding:16px;color:var(--text2);font-size:15px">No se encontraron ítems.</div>';return}
  area.innerHTML=`<div class="scan-card">
    <div class="scan-header"><h3>${data.store||'Ticket'}</h3><p>${data.date}</p></div>
    ${data.items.map((it,i)=>`
      <div class="scan-item">
        <input type="checkbox" id="sc${i}" checked>
        <div class="si-info">
          <div class="si-desc">${it.desc}</div>
          <div class="si-cat">${CAT_EMOJIS[it.cat]||'📦'} ${it.cat}</div>
        </div>
        <div class="si-amt">-${fmt(it.amount)}</div>
      </div>`).join('')}
  </div>
  <button class="btn-primary" onclick="importScan(${JSON.stringify(data).replace(/"/g,'&quot;')})">Importar seleccionados</button>`;
}

async function importScan(data){
  let count=0;
  const promises=[];
  data.items.forEach((it,i)=>{
    if(document.getElementById('sc'+i)?.checked){
      promises.push(addDoc(collection(db,'transacciones'),{type:'expense',desc:it.desc,amount:it.amount,cat:it.cat,date:data.date,createdAt:Date.now()}));
      count++;
    }
  });
  await Promise.all(promises);
  document.getElementById('scanArea').innerHTML=`<div style="padding:20px;text-align:center;font-size:17px;color:var(--green);font-weight:600">✓ ${count} ítem${count!==1?'s':''} importado${count!==1?'s':''}</div>`;
  document.getElementById('ticketPreview').style.display='none';
  if(navigator.vibrate)navigator.vibrate([30,50,30]);
}

currentDate=new Date();
load();
initTicket();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
