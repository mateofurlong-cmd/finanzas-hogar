<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="theme-color" content="#1D9E75">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Finanzas del Hogar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    :root{--green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;--red:#D85A30;--red-light:#FAECE7;--blue:#378ADD;--blue-light:#EAF2FB;--bg:#F5F5F0;--bg-card:#FFFFFF;--text:#1a1a18;--text2:#6B6B66;--border:rgba(0,0,0,0.1);--radius:14px;--radius-sm:8px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    @media(prefers-color-scheme:dark){:root{--bg:#111110;--bg-card:#1e1e1c;--text:#f0ede6;--text2:#9a9891;--border:rgba(255,255,255,0.1);--green-light:#0a3325;--red-light:#3a1a0d;--blue-light:#0d1f35}}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--text);overscroll-behavior:none}
    .app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}
    .screen{display:none;overflow-y:auto;padding:0 16px 12px;padding-top:calc(var(--safe-top) + 56px);padding-bottom:calc(var(--safe-bottom) + 80px)}
    .screen.active{display:block}
    .topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);padding:calc(var(--safe-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
    .topbar-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
    .curr-toggle{display:flex;background:var(--bg-card);border-radius:999px;padding:2px;border:0.5px solid var(--border)}
    .curr-btn{padding:3px 10px;border:none;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s}
    .curr-btn.active{background:var(--green);color:#fff}
    .month-nav{display:flex;align-items:center;gap:6px}
    .month-nav button{background:none;border:none;font-size:20px;color:var(--green);padding:4px 6px;cursor:pointer}
    .month-label{font-size:14px;font-weight:500;min-width:100px;text-align:center}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg-card);border-top:0.5px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:9px;font-weight:500;transition:color .15s;position:relative}
    .nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .nav-item.active{color:var(--green)}
    .nav-badge{position:absolute;top:5px;right:calc(50% - 16px);background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:999px;padding:1px 4px;min-width:15px;text-align:center}
    .card{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:14px}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .metric-full{grid-column:1/-1}
    .metric{background:var(--bg-card);border-radius:var(--radius);padding:14px 16px}
    .metric label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
    .metric .val{font-size:22px;font-weight:700;letter-spacing:-.5px}
    .metric .val.inc{color:var(--green)}.metric .val.exp{color:var(--red)}
    .tx-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
    .tx-item:last-child{border-bottom:none}
    .tx-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .tx-icon.income{background:var(--green-light)}.tx-icon.expense{background:var(--red-light)}
    .tx-info{flex:1;min-width:0}
    .tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-meta{font-size:11px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .tx-amount{font-size:14px;font-weight:600;flex-shrink:0}
    .tx-amount.income{color:var(--green)}.tx-amount.expense{color:var(--red)}
    .tx-actions{display:flex;gap:2px;flex-shrink:0}
    .tx-btn{font-size:15px;background:none;border:none;cursor:pointer;padding:3px;opacity:.45;border-radius:6px}
    .tx-btn:active{opacity:1}
    .empty{text-align:center;padding:28px 16px;color:var(--text2);font-size:14px}
    .type-toggle{display:flex;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px}
    .type-btn{flex:1;padding:9px;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s}
    .type-btn.active-inc{background:var(--bg-card);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .type-btn.active-exp{background:var(--bg-card);color:var(--red);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .field{margin-bottom:12px}
    .field label{font-size:13px;color:var(--text2);margin-bottom:5px;display:block}
    .field input,.field select{width:100%;background:var(--bg);border:none;border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;color:var(--text);outline:none;appearance:none;-webkit-appearance:none}
    .field input:focus,.field select:focus{box-shadow:0 0 0 2px var(--green)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn-primary{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
    .btn-primary:active{opacity:.85}
    .btn-secondary{width:100%;padding:12px;background:var(--bg);color:var(--text);border:none;border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;margin-top:8px}
    .pay-chips{display:flex;gap:6px;margin-bottom:12px}
    .pay-chip{flex:1;padding:9px 4px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:500;text-align:center;cursor:pointer;background:none;color:var(--text2);transition:all .15s}
    .pay-chip.active{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
    .curr-chips{display:flex;gap:6px;margin-bottom:12px}
    .curr-chip{flex:1;padding:9px 4px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:600;text-align:center;cursor:pointer;background:none;color:var(--text2);transition:all .15s}
    .curr-chip.active-ars{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
    .curr-chip.active-usd{border-color:var(--blue);background:var(--blue-light);color:#1a5fa8}
    .upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;cursor:pointer;position:relative;background:var(--bg);margin-bottom:12px}
    .upload-zone input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
    .upload-zone .uz-icon{font-size:38px;margin-bottom:8px}
    .upload-zone p{font-size:15px;font-weight:500}.upload-zone small{font-size:13px;color:var(--text2)}
    .preview-img{width:100%;max-height:180px;object-fit:contain;border-radius:var(--radius-sm);margin-bottom:12px;display:none}
    .scan-card{background:var(--bg-card);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
    .scan-header{padding:14px 16px 10px;border-bottom:0.5px solid var(--border)}
    .scan-header h3{font-size:15px;font-weight:600}.scan-header p{font-size:13px;color:var(--text2);margin-top:2px}
    .scan-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:0.5px solid var(--border)}
    .scan-item:last-of-type{border-bottom:none}
    .scan-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}
    .scan-item .si-info{flex:1;min-width:0}.scan-item .si-desc{font-size:15px;font-weight:500}
    .scan-item .si-cat{font-size:12px;color:var(--text2);margin-top:1px}
    .scan-item .si-amt{font-size:15px;font-weight:600;color:var(--red);flex-shrink:0}
    .spinner-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px;color:var(--text2);font-size:15px}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .bar-emoji{width:26px;text-align:center;font-size:15px}
    .bar-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
    .bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
    .bar-val{font-size:13px;font-weight:600;width:80px;text-align:right;flex-shrink:0}
    .budget-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:0.5px solid var(--border)}
    .budget-row:last-child{border-bottom:none}
    .budget-cat{flex:1;font-size:14px;font-weight:500}
    .budget-spent{font-size:12px;color:var(--text2);text-align:right}
    .budget-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .budget-input{width:86px;background:var(--bg);border:none;border-radius:6px;padding:6px 10px;font-size:14px;color:var(--text);text-align:right}
    .year-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .year-pill{padding:5px 14px;border-radius:999px;border:1px solid var(--border);font-size:14px;font-weight:500;background:none;color:var(--text2);cursor:pointer}
    .year-pill.active{background:var(--green);color:#fff;border-color:var(--green)}
    .annual-table{width:100%;border-collapse:collapse;font-size:13px}
    .annual-table th{color:var(--text2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
    .annual-table th:first-child{text-align:left}
    .annual-table td{padding:8px 4px;border-bottom:0.5px solid var(--border);text-align:right}
    .annual-table td:first-child{text-align:left;color:var(--text2);font-weight:500}
    .annual-table .pos{color:var(--green);font-weight:600}.annual-table .neg{color:var(--red);font-weight:600}
    .annual-table tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:none;font-size:14px}
    .fijo-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border)}
    .fijo-item:last-child{border-bottom:none}
    .fijo-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;font-size:13px;color:transparent}
    .fijo-check.paid{background:var(--green);border-color:var(--green);color:#fff}
    .fijo-info{flex:1;min-width:0}
    .fijo-name{font-size:15px;font-weight:500}
    .fijo-meta{font-size:12px;color:var(--text2);margin-top:1px}
    .fijo-amount{font-size:14px;font-weight:600;color:var(--red);flex-shrink:0}
    .fijo-del{font-size:16px;background:none;border:none;cursor:pointer;padding:4px;opacity:.4;color:var(--text)}
    .alert-banner{background:var(--red-light);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--red);cursor:pointer}
    .pay-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px}
    .pay-badge.credito{background:var(--blue-light);color:#1a5fa8}
    .pay-badge.debito{background:var(--green-light);color:var(--green-dark)}
    .pay-badge.efectivo{background:#FEF3E2;color:#8a5a00}
    .pay-badge.transferencia{background:#F0EAF8;color:#6b3fa0}
    .cat-tag{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:500;background:var(--bg)}
    .cat-tag-del{background:none;border:none;cursor:pointer;font-size:14px;opacity:.5;padding:0 2px;color:var(--red)}
    .cats-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .curr-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:1px 5px;border-radius:999px}
    .curr-badge.usd{background:var(--blue-light);color:#1a5fa8}
    .curr-badge.ars{background:var(--green-light);color:var(--green-dark)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .modal{background:var(--bg-card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px;width:100%;max-width:430px;padding-bottom:calc(20px + var(--safe-bottom));max-height:90vh;overflow-y:auto}
    .modal-title{font-size:17px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
    .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2)}
    .section-curr{display:flex;gap:8px;margin-bottom:10px}
    .section-curr button{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:none;cursor:pointer;color:var(--text2)}
    .section-curr button.active-ars{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
    .section-curr button.active-usd{border-color:var(--blue);background:var(--blue-light);color:#1a5fa8}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      💰 Finanzas
      <span id="sync-dot" style="width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block"></span>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="screen active" id="s-resumen"></div>
  <div class="screen" id="s-registrar"></div>
  <div class="screen" id="s-ticket"></div>
  <div class="screen" id="s-fijos"></div>
  <div class="screen" id="s-graficos"></div>
  <div class="screen" id="s-anual"></div>
  <div class="screen" id="s-cats"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showScreen('resumen',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Resumen
    </button>
    <button class="nav-item" onclick="showScreen('registrar',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Agregar
    </button>
    <button class="nav-item" onclick="showScreen('ticket',this)">
      <svg viewBox="0 0 24 24"><path d="M14.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9.5L14.5 4z"/><polyline points="14 4 14 10 20 10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
      Ticket
    </button>
    <button class="nav-item" id="nav-fijos" onclick="showScreen('fijos',this)">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Fijos
    </button>
    <button class="nav-item" onclick="showScreen('graficos',this)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Gráficos
    </button>
    <button class="nav-item" onclick="showScreen('anual',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Anual
    </button>
    <button class="nav-item" onclick="showScreen('cats',this);renderCatEditor()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Cats
    </button>
  </nav>
</div>

<!-- MODAL EDITAR -->
<div class="modal-overlay" id="editModal" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Editar <button class="modal-close" onclick="closeEditModal()">×</button></div>
    <div class="field"><label>Descripción</label><input type="text" id="e-desc"></div>
    <div class="form-row">
      <div class="field"><label>Monto</label><input type="number" id="e-amount" inputmode="decimal"></div>
      <div class="field"><label>Fecha</label><input type="date" id="e-date"></div>
    </div>
    <div class="field"><label>Moneda</label>
      <div class="section-curr">
        <button id="ec-ars" onclick="setEditCurr('ARS')">🇦🇷 ARS</button>
        <button id="ec-usd" onclick="setEditCurr('USD')">🇺🇸 USD</button>
      </div>
    </div>
    <div class="field"><label>Categoría</label>
      <select id="e-cat"><option>Alimentación</option><option>Servicios</option><option>Salud</option><option>Educación</option><option>Transporte</option><option>Entretenimiento</option><option>Ahorros</option><option>Otros</option></select>
    </div>
    <div class="field"><label>Forma de pago</label>
      <div class="pay-chips">
        <button class="pay-chip" id="ep-efectivo" onclick="setEditPay('efectivo')">💵 Efectivo</button>
        <button class="pay-chip" id="ep-debito" onclick="setEditPay('debito')">💳 Débito</button>
        <button class="pay-chip" id="ep-credito" onclick="setEditPay('credito')">🏦 Crédito</button>
        <button class="pay-chip" id="ep-transferencia" onclick="setEditPay('transferencia')">🔁 Transfer.</button>
      </div>
    </div>
    <button class="btn-primary" onclick="saveEdit()">Guardar cambios</button>
    <button class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA0IwaRWf8fOEJmTmV3dhIpsTn7V_r31KI",
  authDomain: "finanzas-hogar-bfb7c.firebaseapp.com",
  projectId: "finanzas-hogar-bfb7c",
  storageBucket: "finanzas-hogar-bfb7c.firebasestorage.app",
  messagingSenderId: "821752721307",
  appId: "1:821752721307:web:76ee314134fd9addae3b3e"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

let CATS=['Alimentación','Servicios','Salud','Educación','Transporte','Entretenimiento','Ahorros','Otros'];
const CAT_COLORS=['#1D9E75','#378ADD','#D4537E','#7F77DD','#D85A30','#BA7517','#639922','#888780'];
const CAT_EMOJIS={Alimentación:'🛒',Servicios:'💡',Salud:'❤️',Educación:'📚',Transporte:'🚌',Entretenimiento:'🎬',Ahorros:'💰',Otros:'📦'};
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_S=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PAY_LABELS={efectivo:'💵 Efectivo',debito:'💳 Débito',credito:'🏦 Crédito',transferencia:'🔁 Transferencia'};

let txs=[], budgets={}, fijos=[], pagosFijos={}, userCats=null;
let currentDate=new Date(), selectedYear=new Date().getFullYear();
let currentType='expense', currentPay='efectivo', currentCurr='ARS';
let editDocId=null, editPay='efectivo', editCurr='ARS';
let fijoPay='efectivo', fijoCurr='ARS';
let viewCurr='ARS'; // moneda activa en el filtro de vista
let barChart, donutChart, annualChart;

function setStatus(ok){const el=document.getElementById('sync-dot');if(el)el.style.background=ok?'#1D9E75':'#D85A30'}

function load(){
  onSnapshot(collection(db,'transacciones'),snap=>{
    txs=snap.docs.map(d=>({...d.data(),_docId:d.id}));
    txs.sort((a,b)=>b.date.localeCompare(a.date));
    setStatus(true);renderAll();
    if(document.getElementById('s-anual').classList.contains('active'))renderAnual();
  },()=>setStatus(false));
  onSnapshot(doc(db,'config','budgets'),snap=>{if(snap.exists())budgets=snap.data();renderAll()});
  onSnapshot(collection(db,'gastosFijos'),snap=>{
    fijos=snap.docs.map(d=>({...d.data(),_docId:d.id}));
    fijos.sort((a,b)=>a.name.localeCompare(b.name));
    renderFijos();updateFijosBadge();
  });
  onSnapshot(collection(db,'pagosFijos'),snap=>{
    pagosFijos={};snap.docs.forEach(d=>pagosFijos[d.id]=d.data());
    renderFijos();updateFijosBadge();
  });
  onSnapshot(doc(db,"config","cats"),snap=>{
    if(snap.exists()&&snap.data().list){
      userCats=snap.data().list;
      CATS.length=0;snap.data().list.forEach(c=>CATS.push(c));
    }
    renderAll();
    if(document.getElementById("s-fijos").classList.contains("active"))renderFijos();
    if(document.getElementById("s-anual").classList.contains("active"))renderAnual();
  });
}

// Detección automática de categoría por palabras clave
const CAT_KEYWORDS={
  'Alimentación':['super','supermercado','mercado','carrefour','dia','coto','jumbo','disco','vea','walmart','almacen','verduleria','panaderia','carniceria','fiambreria','kiosco','kiosko','delivery','rappi','pedidosya','mcdonalds','burger','pizza','sushi','resto','restaurante','bar','cafe','cafeteria','heladeria','comida','facturas','medialunas','pan'],
  'Servicios':['luz','edesur','edenor','gas','metrogas','naturgy','agua','aysa','internet','fibertel','telecentro','flow','cablevision','claro','personal','movistar','tuenti','telefono','celular','expensas','alquiler','seguro','wifi'],
  'Salud':['farmacia','farmacity','doctor','medico','consulta','clinica','hospital','laboratorio','analisis','odontol','dentista','optometri','anteojo','lente','medicina','obra social','osde','swiss','galeno','medicamento','remedios'],
  'Educación':['colegio','escuela','universidad','facultad','curso','libro','libreria','cuota','matricula','ingles','clases'],
  'Transporte':['nafta','combustible','ypf','shell','axion','pedido','uber','cabify','remis','colectivo','subte','tren','peaje','estacionamiento','garage','sube','auto','mecanico','repuesto'],
  'Entretenimiento':['cine','teatro','netflix','spotify','disney','hbo','amazon','prime','juego','videojuego','steam','play','musica','concierto','show','entrada','evento','gym','gimnasio','deporte'],
  'Ahorros':['ahorro','inversion','plazo fijo','fondo','crypto','bitcoin','dolar','divisa'],
};
function detectCat(desc){
  const d=desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const [cat,words] of Object.entries(CAT_KEYWORDS)){
    if(words.some(w=>d.includes(w)))return cat;
  }
  return null;
}

function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function mTxs(){return txs.filter(t=>t.date&&t.date.startsWith(mk(currentDate))&&(t.curr||'ARS')===viewCurr)}
function yTxs(y){return txs.filter(t=>t.date&&t.date.startsWith(y+'-')&&(t.curr||'ARS')===viewCurr)}
function fijoKey(id){return mk(currentDate)+'-'+id}
function fmtC(n,curr){
  const sym=curr==='USD'?'U$S ':'$';
  return sym+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:curr==='USD'?2:0,maximumFractionDigits:curr==='USD'?2:0});
}
function fmt(n){return fmtC(n,viewCurr)}

function changeMonth(d){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+d,1);renderAll();renderFijos();updateFijosBadge()}

function setViewCurr(c){
  viewCurr=c;
  document.getElementById('vc-ars').classList.toggle('active',c==='ARS');
  document.getElementById('vc-usd').classList.toggle('active',c==='USD');
  renderAll();
  if(document.getElementById('s-anual').classList.contains('active'))renderAnual();
}

function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
  document.querySelector('.month-nav').style.display=id==='anual'?'none':'flex';
  if(id==='anual')renderAnual();
  if(id==='fijos')renderFijos();
}

function setType(t){currentType=t;document.getElementById('btn-inc').className='type-btn'+(t==='income'?' active-inc':'');document.getElementById('btn-exp').className='type-btn'+(t==='expense'?' active-exp':'')}
function setPay(p){currentPay=p;['efectivo','debito','credito','transferencia'].forEach(x=>document.getElementById('p-'+x).classList.toggle('active',x===p))}
function setCurr(c){currentCurr=c;['ARS','USD'].forEach(x=>{const el=document.getElementById('c-'+x.toLowerCase());if(el)el.className='curr-chip'+(x===c?' active-'+x.toLowerCase():'')})}
function setEditPay(p){editPay=p;['efectivo','debito','credito','transferencia'].forEach(x=>{const el=document.getElementById('ep-'+x);if(el)el.classList.toggle('active',x===p)})}
function setEditCurr(c){editCurr=c;['ars','usd'].forEach(x=>{const el=document.getElementById('ec-'+x);if(el)el.className=(x.toUpperCase()===c?'active-'+x:'')})}
function autoCat(desc){
  const hint=document.getElementById('cat-hint');
  if(!hint)return;
  if(desc.length<3){hint.style.display='none';return}
  const cat=detectCat(desc);
  if(cat){
    const sel=document.getElementById('f-cat');
    if(sel)sel.value=cat;
    hint.style.display='block';
    hint.textContent=`${CAT_EMOJIS[cat]||'📦'} Detectado: ${cat}`;
  } else {
    hint.style.display='none';
  }
}
function setFijoPay(p){fijoPay=p;['efectivo','debito','credito','transferencia'].forEach(x=>{const el=document.getElementById('nfp-'+x);if(el)el.classList.toggle('active',x===p)})}
function setFijoCurr(c){fijoCurr=c;['ars','usd'].forEach(x=>{const el=document.getElementById('nfc-'+x);if(el)el.className='curr-chip'+(x.toUpperCase()===c?' active-'+x:'')})}

async function addTx(){
  const desc=document.getElementById('f-desc').value.trim();
  const amount=parseFloat(document.getElementById('f-amount').value);
  const cat=document.getElementById('f-cat').value;
  const date=document.getElementById('f-date').value;
  if(!desc||!amount||amount<=0||!date){alert('Completá todos los campos.');return}
  await addDoc(collection(db,'transacciones'),{type:currentType,desc,amount,cat,date,pay:currentPay,curr:currentCurr,createdAt:Date.now()});
  document.getElementById('f-desc').value='';document.getElementById('f-amount').value='';
  if(navigator.vibrate)navigator.vibrate(30);
  showScreen('resumen',document.querySelector('.nav-item'));
}

async function delTx(docId){if(confirm('¿Eliminar?'))await deleteDoc(doc(db,'transacciones',docId))}

function openEdit(docId){
  const t=txs.find(x=>x._docId===docId);if(!t)return;
  editDocId=docId;
  document.getElementById('e-desc').value=t.desc;
  document.getElementById('e-amount').value=t.amount;
  document.getElementById('e-date').value=t.date;
  document.getElementById('e-cat').value=t.cat;
  setEditPay(t.pay||'efectivo');
  setEditCurr(t.curr||'ARS');
  document.getElementById('editModal').style.display='flex';
}
async function saveEdit(){
  if(!editDocId)return;
  const desc=document.getElementById('e-desc').value.trim();
  const amount=parseFloat(document.getElementById('e-amount').value);
  const date=document.getElementById('e-date').value;
  const cat=document.getElementById('e-cat').value;
  if(!desc||!amount||!date){alert('Completá todos los campos.');return}
  await updateDoc(doc(db,'transacciones',editDocId),{desc,amount,cat,date,pay:editPay,curr:editCurr});
  closeEditModal();
}
function closeEditModal(){editDocId=null;document.getElementById('editModal').style.display='none'}
function closeModal(e){if(e.target.id==='editModal')closeEditModal()}

        const paid=!!pagosFijos[fijoKey(f._docId)];
        return`<div class="fijo-item">
          <div class="fijo-check ${paid?'paid':''}" onclick="toggleFijo('${f._docId}')">${paid?'✓':''}</div>

async function addFijo(){
  const name=document.getElementById('nf-name').value.trim();
  const amount=parseFloat(document.getElementById('nf-amount').value);
  const cat=document.getElementById('nf-cat').value;
  if(!name||!amount||amount<=0){alert('Completá nombre y monto.');return}
  await addDoc(collection(db,'gastosFijos'),{name,amount,cat,pay:fijoPay,curr:fijoCurr});
  document.getElementById('nf-name').value='';document.getElementById('nf-amount').value='';
}
async function delFijo(docId){if(confirm('¿Eliminar este gasto fijo?'))await deleteDoc(doc(db,'gastosFijos',docId))}
async function toggleFijo(docId){
  const key=fijoKey(docId);
  if(pagosFijos[key]){
    await deleteDoc(doc(db,'pagosFijos',key));
  } else {
    const f=fijos.find(x=>x._docId===docId);
    const today=new Date().toISOString().split('T')[0];
    await setDoc(doc(db,'pagosFijos',key),{fijoId:docId,month:mk(currentDate),paidAt:today});
    await addDoc(collection(db,'transacciones'),{type:'expense',desc:f.name,amount:f.amount,cat:f.cat,pay:f.pay||'efectivo',curr:f.curr||'ARS',date:today,createdAt:Date.now(),esFijo:true});
    if(navigator.vibrate)navigator.vibrate(30);
  }
}
function updateFijosBadge(){
  const pendientes=fijos.filter(f=>!pagosFijos[fijoKey(f._docId)]).length;
  const nav=document.getElementById('nav-fijos');
  const ex=nav.querySelector('.nav-badge');if(ex)ex.remove();
  if(pendientes>0){const b=document.createElement('span');b.className='nav-badge';b.textContent=pendientes;nav.appendChild(b)}
}

function renderAll(){
  const m=mTxs();
  document.getElementById('monthLabel').textContent=MONTHS[currentDate.getMonth()]+' '+currentDate.getFullYear();
  renderResumen(m);renderRegistrar(m);renderGraficos(m);
}

function renderResumen(m){
  const inc=m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=inc-exp;
  const pct=inc>0?Math.min(100,Math.round(exp/inc*100)):exp>0?100:0;
  const pendFijos=fijos.filter(f=>(f.curr||'ARS')===viewCurr&&!pagosFijos[fijoKey(f._docId)]);
  // top categorías de gasto
  const expTotals={};
  m.filter(t=>t.type==='expense').forEach(t=>expTotals[t.cat]=(expTotals[t.cat]||0)+t.amount);
  const topCats=Object.entries(expTotals).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const maxCat=topCats[0]?topCats[0][1]:1;

  document.getElementById('s-resumen').innerHTML=`
    ${currFilterHTML()}
    ${pendFijos.length?`<div class="alert-banner" onclick="showScreen('fijos',document.getElementById('nav-fijos'))">⚠️ <strong>${pendFijos.length} gasto${pendFijos.length!==1?'s':''} fijo${pendFijos.length!==1?'s':''}</strong> pendiente${pendFijos.length!==1?'s':''} — tocá para ver</div>`:''}
    <div class="card" style="background:${bal>=0?'var(--green)':'var(--red)'};color:#fff;padding:20px">
      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-bottom:6px">Balance ${MONTHS[currentDate.getMonth()]}</div>
      <div style="font-size:36px;font-weight:700;letter-spacing:-1px">${(bal>=0?'+':'')+fmt(bal)}</div>
      <div style="margin-top:14px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:#fff;border-radius:2px;opacity:.7;transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;opacity:.9">
        <span>↑ ${fmt(inc)}</span><span>↓ ${fmt(exp)} (${pct}%)</span>
      </div>
    </div>
    ${topCats.length?`<div class="card">
      <div class="card-title">Top gastos del mes</div>
      ${topCats.map(([cat,val])=>{const i=CATS.indexOf(cat),color=i>=0?CAT_COLORS[i]:'#888780';return`<div class="bar-row"><span class="bar-emoji">${CAT_EMOJIS[cat]||'📦'}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/maxCat*100)}%;background:${color}"></div></div><span class="bar-val" style="color:${color}">${fmt(val)}</span></div>`}).join('')}
    </div>`:''}
    <div class="card">
      <div class="card-title">Últimas transacciones</div>
      ${m.length?m.slice(0,15).map(t=>txHTML(t)).join(''):'<div class="empty">Sin transacciones en ${viewCurr} este mes</div>'}
    </div>`;
}

function renderGraficos(m){
  const expTotals={};
  m.filter(t=>t.type==='expense').forEach(t=>expTotals[t.cat]=(expTotals[t.cat]||0)+t.amount);
  const sorted=Object.entries(expTotals).sort((a,b)=>b[1]-a[1]);
  const maxVal=Math.max(...sorted.map(e=>e[1]),1);
  const inc=m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const payTotals={efectivo:0,debito:0,credito:0,transferencia:0};
  m.filter(t=>t.type==='expense').forEach(t=>payTotals[t.pay||'efectivo']=(payTotals[t.pay||'efectivo']||0)+t.amount);

  document.getElementById('s-graficos').innerHTML=`
    ${currFilterHTML()}
    <div class="card">
      <div class="card-title">Gastos por categoría (${viewCurr})</div>
      ${sorted.length?sorted.map(([cat,val])=>{const i=CATS.indexOf(cat),color=i>=0?CAT_COLORS[i]:'#888780';return`<div class="bar-row"><span class="bar-emoji">${CAT_EMOJIS[cat]||'📦'}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/maxVal*100)}%;background:${color}"></div></div><span class="bar-val" style="color:${color}">${fmt(val)}</span></div>`}).join(''):'<div class="empty">Sin gastos</div>'}
    </div>
    <div class="card">
      <div class="card-title">Por forma de pago</div>
      ${Object.entries(payTotals).filter(([,v])=>v>0).map(([p,v])=>`<div class="bar-row"><span class="bar-emoji">${p==='credito'?'🏦':p==='debito'?'💳':'💵'}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/Math.max(exp,1)*100)}%;background:${p==='credito'?'#378ADD':p==='debito'?'#1D9E75':p==='transferencia'?'#6b3fa0':'#BA7517'}"></div></div><span class="bar-val">${fmt(v)}</span></div>`).join('')||'<div class="empty">Sin gastos</div>'}
    </div>
    <div class="card"><div class="card-title">Ingresos vs gastos</div><div style="position:relative;height:180px"><canvas id="barChart"></canvas></div></div>
    ${Object.keys(expTotals).length?`<div class="card"><div class="card-title">Distribución</div><div id="donut-legend" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text2)"></div><div style="position:relative;height:200px"><canvas id="donutChart"></canvas></div></div>`:''}
    <div class="card">
      <div class="card-title">Presupuesto mensual (${viewCurr})</div>
      ${CATS.filter(c=>c!=='Ahorros'&&c!=='Otros').map(cat=>{
        const spent=Math.round(expTotals[cat]||0),lim=budgets[viewCurr+'_'+cat]||0;
        const over=lim&&spent>lim,ok=lim&&spent<=lim;
        return`<div class="budget-row"><span style="font-size:16px;margin-right:2px">${CAT_EMOJIS[cat]}</span><span class="budget-cat">${cat}</span><span class="budget-spent">${fmt(spent)}${lim?' / '+fmt(lim):''}</span><input class="budget-input" type="number" placeholder="Límite" value="${lim||''}" onchange="updateBudget('${viewCurr}_${cat}',this.value)"><div class="budget-dot" style="background:${over?'#D85A30':ok?'#1D9E75':'#ccc'}"></div></div>`;
      }).join('')}
    </div>`;

  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('barChart'),{type:'bar',data:{labels:['Ingresos','Gastos'],datasets:[{data:[Math.round(inc),Math.round(exp)],backgroundColor:['#1D9E75','#D85A30'],borderRadius:8,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtC(v,viewCurr),font:{size:11}}}}}});
  if(Object.keys(expTotals).length){
    const labels=Object.keys(expTotals),data=labels.map(k=>Math.round(expTotals[k]));
    const colors=labels.map(l=>{const i=CATS.indexOf(l);return i>=0?CAT_COLORS[i]:'#888780'});
    const total=data.reduce((s,v)=>s+v,0);
    document.getElementById('donut-legend').innerHTML=labels.map((l,i)=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${colors[i]};display:inline-block"></span>${CAT_EMOJIS[l]||''} ${l} ${total?Math.round(data[i]/total*100):0}%</span>`).join('');
    if(donutChart)donutChart.destroy();
    donutChart=new Chart(document.getElementById('donutChart'),{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}});
  }
}

async function updateBudget(key,val){budgets[key]=parseFloat(val)||0;await setDoc(doc(db,'config','budgets'),budgets)}

function renderAnual(){
  const allYears=[...new Set(txs.map(t=>t.date?t.date.slice(0,4):null).filter(Boolean))].sort();
  if(!allYears.includes(String(selectedYear)))allYears.push(String(selectedYear));
  allYears.sort();
  const yTx=yTxs(selectedYear);
  const monthly=Array.from({length:12},(_,i)=>{
    const k=selectedYear+'-'+String(i+1).padStart(2,'0');
    const mo=yTx.filter(t=>t.date.startsWith(k));
    return{inc:mo.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp:mo.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)};
  });
  const totInc=monthly.reduce((s,m)=>s+m.inc,0),totExp=monthly.reduce((s,m)=>s+m.exp,0),totBal=totInc-totExp;
  document.getElementById('s-anual').innerHTML=`
    <div style="padding-top:16px">
    ${currFilterHTML()}
    <div class="metrics">
      <div class="metric"><label>Ingresos ${selectedYear} (${viewCurr})</label><div class="val inc">${fmt(totInc)}</div></div>
      <div class="metric"><label>Gastos ${selectedYear} (${viewCurr})</label><div class="val exp">${fmt(totExp)}</div></div>
    </div>
    <div class="card">
      <div class="year-pills">${allYears.map(y=>`<button class="year-pill ${y==selectedYear?'active':''}" onclick="selectYear(${y})">${y}</button>`).join('')}</div>
      <div style="position:relative;height:180px"><canvas id="annualChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Detalle mes a mes</div>
      <table class="annual-table">
        <thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Balance</th></tr></thead>
        <tbody>${monthly.map((m,i)=>{const b=m.inc-m.exp,has=m.inc>0||m.exp>0;return`<tr style="${!has?'opacity:.35':''}"><td>${MONTHS_S[i]}</td><td class="${m.inc>0?'pos':''}">${m.inc>0?fmt(m.inc):'-'}</td><td class="${m.exp>0?'neg':''}">${m.exp>0?fmt(m.exp):'-'}</td><td class="${b>=0?'pos':'neg'}">${has?(b>=0?'+':'-')+fmt(b):'-'}</td></tr>`}).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="pos">${fmt(totInc)}</td><td class="neg">${fmt(totExp)}</td><td class="${totBal>=0?'pos':'neg'}">${(totBal>=0?'+':'-')+fmt(totBal)}</td></tr></tfoot>
      </table>
    </div></div>`;
  if(annualChart)annualChart.destroy();
  annualChart=new Chart(document.getElementById('annualChart'),{type:'bar',data:{labels:MONTHS_S,datasets:[{label:'Ingresos',data:monthly.map(m=>Math.round(m.inc)),backgroundColor:'#1D9E75',borderRadius:4,borderSkipped:false},{label:'Gastos',data:monthly.map(m=>Math.round(m.exp)),backgroundColor:'#D85A30',borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},autoSkip:false}},y:{ticks:{callback:v=>fmtC(v,viewCurr),font:{size:10}}}}}});
}

function selectYear(y){selectedYear=y;renderAnual()}

function initTicket(){
  document.getElementById('s-ticket').innerHTML=`
    <div class="card">
      <div class="card-title">Escanear ticket con IA</div>
      <div class="upload-zone">
        <input type="file" accept="image/*" capture="environment" onchange="handleTicket(event)">
        <div class="uz-icon">📷</div>
        <p>Tocá para sacar una foto</p>
        <small>O elegí una imagen de tu galería</small>
      </div>
      <img id="ticketPreview" class="preview-img">
      <div id="scanArea"></div>
    </div>`;
}

async function handleTicket(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    const prev=document.getElementById('ticketPreview');
    prev.src=ev.target.result;prev.style.display='block';
    // Comprimir imagen antes de enviar
    const compressed=await compressImage(ev.target.result);
    await scanTicket(compressed.split(',')[1],'image/jpeg');
  };
  reader.readAsDataURL(file);e.target.value='';
}
async function compressImage(dataUrl,maxW=1200,quality=0.75){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      res(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=dataUrl;
  });
}

async function scanTicket(b64,mime){
  const area=document.getElementById('scanArea');
  area.innerHTML=`<div class="spinner-wrap"><div class="spinner"></div><span>Analizando el ticket...</span></div>`;
  try{
    const resp=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mediaType:mime})});
    const parsed=await resp.json();
    if(parsed.error){area.innerHTML=`<div style="padding:16px;color:var(--red);font-size:15px">⚠️ ${parsed.error}</div>`;return}
    showScanResult(parsed);
  }catch(err){
    area.innerHTML=`<div style="padding:16px;color:var(--red);font-size:15px">❌ Error al analizar. Revisá tu conexión e intentá de nuevo.</div>`;
  }
}

function showScanResult(data){
  const area=document.getElementById('scanArea');
  if(!data.items?.length){area.innerHTML='<div style="padding:16px;color:var(--text2);font-size:15px">No se encontraron ítems.</div>';return}
  const curr=data.curr||'ARS';
  area.innerHTML=`<div class="scan-card">
    <div class="scan-header"><h3>${data.store||'Ticket'} <span class="curr-badge ${curr.toLowerCase()}">${curr}</span></h3><p>${data.date}</p></div>
    ${data.items.map((it,i)=>`<div class="scan-item"><input type="checkbox" id="sc${i}" checked><div class="si-info"><div class="si-desc">${it.desc}</div><div class="si-cat">${CAT_EMOJIS[it.cat]||'📦'} ${it.cat}</div></div><div class="si-amt">-${fmtC(it.amount,curr)}</div></div>`).join('')}
  </div>
  <button class="btn-primary" onclick="importScan(${JSON.stringify(data).replace(/"/g,'&quot;')})">Importar seleccionados</button>`;
}

async function importScan(data){
  let count=0;const promises=[];
  data.items.forEach((it,i)=>{
    if(document.getElementById('sc'+i)?.checked){
      promises.push(addDoc(collection(db,'transacciones'),{type:'expense',desc:it.desc,amount:it.amount,cat:it.cat,pay:'efectivo',curr:data.curr||'ARS',date:data.date,createdAt:Date.now()}));
      count++;
    }
  });
  await Promise.all(promises);
  document.getElementById('scanArea').innerHTML=`<div style="padding:20px;text-align:center;font-size:17px;color:var(--green);font-weight:600">✓ ${count} ítem${count!==1?'s':''} importado${count!==1?'s':''}</div>`;
  document.getElementById('ticketPreview').style.display='none';
  if(navigator.vibrate)navigator.vibrate([30,50,30]);
}


// CATEGORIAS PERSONALIZADAS
const CAT_COLORS_EXTRA=["#E85D9A","#22B8B0","#F4A22D","#8B5CF6","#E74C3C","#16A085","#D35400","#2980B9"];
function catColor(cat){const i=CATS.indexOf(cat);return i>=0&&i<CAT_COLORS.length?CAT_COLORS[i]:CAT_COLORS_EXTRA[i%CAT_COLORS_EXTRA.length]||"#888780"}
function catEmoji(cat){const map={Alimentación:"🛒",Servicios:"💡",Salud:"❤️",Educación:"📚",Transporte:"🚌",Entretenimiento:"🎬",Ahorros:"💰",Otros:"📦"};return map[cat]||"📂"}
async function saveCats(){await setDoc(doc(db,"config","cats"),{list:[...CATS]})}
async function addCat(){
  const input=document.getElementById("new-cat-input");
  const name=input.value.trim();
  if(!name){alert("Ingresá un nombre.");return}
  if(CATS.includes(name)){alert("Ya existe.");return}
  CATS.push(name);
  await saveCats();
  input.value="";
}
async function delCat(cat){
  if(!confirm("¿Eliminar la categoría "+cat+"?"))return;
  const idx=CATS.indexOf(cat);if(idx<0)return;
  CATS.splice(idx,1);
  await saveCats();
}
function renderCatEditor(){
  const el=document.getElementById("s-cats");
  if(!el)return;
  el.innerHTML=`
    <div class="card">
      <div class="card-title">Categorías</div>
      <div class="cats-grid">${CATS.map(c=>`<div class="cat-tag"><span>${catEmoji(c)}</span>${c}<button class="cat-tag-del" onclick="delCat('${c}')">×</button></div>`).join("")}</div>
      <div class="field"><label>Nueva categoría</label><input type="text" id="new-cat-input" placeholder="Ej: Mascotas"></div>
      <button class="btn-primary" onclick="addCat()">+ Agregar</button>
    </div>`;
}
